<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>%SITE_TITLE%</title>
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />
    <link rel="canonical" href="https://perekopskyi.github.io/" />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161411" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a stored theme choice before first paint (see ThemeToggle.tsx).
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          var color = theme === "dark" ? "#161411" : "#f3f0e8";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute("content", color);
          });
        }
      } catch (error) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="%SITE_FULL_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta
      property="og:description"
      content="%SITE_DESCRIPTION%"
    />
    <meta property="og:url" content="https://perekopskyi.github.io/" />
    <meta property="og:image" content="https://perekopskyi.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SITE_FULL_NAME%, %SITE_ROLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta
      name="twitter:description"
      content="%SITE_DESCRIPTION%"
    />
    <meta name="twitter:image" content="https://perekopskyi.github.io/og.png" />
    <meta name="twitter:image:alt" content="%SITE_FULL_NAME%, %SITE_ROLE%" />
    <script type="application/ld+json">%SITE_JSON_LD%</script>
  </head>
  <body>
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
        [data-theme-toggle] {
          display: none !important;
        }
      </style>
    </noscript>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
